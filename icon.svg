<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4fb3"/>
      <stop offset="0.55" stop-color="#132c6e"/>
      <stop offset="1" stop-color="#0a1740"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffb163"/>
      <stop offset="0.45" stop-color="#f58a2e"/>
      <stop offset="1" stop-color="#c85a14"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9fd3ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="ballclip"><circle cx="256" cy="262" r="150"/></clipPath>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 球場弧線(低調裝飾) -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6">
    <path d="M-40 420 A 300 300 0 0 1 552 420"/>
    <path d="M60 512 A 196 196 0 0 1 452 512"/>
    <circle cx="256" cy="80" r="70"/>
  </g>
  <!-- 光暈 -->
  <circle cx="256" cy="262" r="220" fill="url(#glow)"/>
  <!-- 籃球 -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="262" r="150" fill="url(#ball)"/>
  </g>
  <g clip-path="url(#ballclip)" fill="none" stroke="#5a2308" stroke-opacity="0.9" stroke-width="9" stroke-linecap="round">
    <path d="M106 262 H406"/>
    <path d="M256 112 V412"/>
    <path d="M150 150 C 215 215, 215 309, 150 374"/>
    <path d="M362 150 C 297 215, 297 309, 362 374"/>
  </g>
  <!-- 高光 -->
  <ellipse cx="205" cy="190" rx="54" ry="30" fill="#ffffff" fill-opacity="0.18" transform="rotate(-28 205 190)" filter="url(#soft)"/>
  <!-- 上揚趨勢線(預測) -->
  <polyline points="128,352 196,286 248,318 320,224 384,166" fill="none" stroke="#0a1740" stroke-opacity="0.55" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="128,352 196,286 248,318 320,224 384,166" fill="none" stroke="url(#line)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 箭頭端點 -->
  <path d="M352 150 L404 146 L396 198 Z" fill="#ffffff"/>
  <circle cx="384" cy="166" r="14" fill="#ffffff"/>
</svg>
