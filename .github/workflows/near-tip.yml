name: 臨場傷兵與預測重算
on:
  schedule:
    - cron: '40 15 * * *'   # 美東約 10:40 起(週末午場)
    - cron: '30 21 * * *'   # 美東約 16:30 起(晚場與西岸)
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: nba-neartip
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock --no-audit --no-fund jsdom@24 pdf-parse@1.1.1
      - name: 臨場循環
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/near-tip-loop.sh
