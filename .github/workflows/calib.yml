name: 每日雲端校準

on:
  schedule:
    # GitHub 的排程在低流量 repo 常延後 4~9 小時(實測 06:10 排程多在 10:30~15:00 才跑),
    # 所以一天排三次,哪一次先跑到就先更新;每次都是增量、可重複執行,concurrency 保證不重疊
    - cron: '10 5 * * *'   # UTC 05:10(美東 1:10,西岸晚場大多已結束;未結束的次日自動補)
    - cron: '10 9 * * *'   # UTC 09:10
    - cron: '10 13 * * *'  # UTC 13:10(台灣 21:10)
  workflow_dispatch:        # 也可在 Actions 頁面手動觸發

permissions:
  contents: write

concurrency:
  group: nba-calib
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 安裝 jsdom(雲端直接執行網頁本身的模型)
        run: npm install --no-save --no-package-lock --no-audit --no-fund jsdom@24 pdf-parse@1.1.1
      - name: 執行校準
        run: node scripts/calib.js
      - name: 提交結果
        run: |
          git config user.name "calib-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A calib.json pdb.json seed
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m "每日自動校準 $(date -u +%F)"
          git pull --rebase origin main
          git push
