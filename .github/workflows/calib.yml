name: 每日雲端校準

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'scripts/**'
      - .github/workflows/calib.yml
  schedule:
    # 三次完整維護與兩次賽前快速更新；GitHub 排程可能延遲，不保證準點。
    # 賽前更新優先執行，已開打的預測由程式保持凍結。
    - cron: '10 5 * * *'   # UTC 05:10(美東 1:10,西岸晚場大多已結束;未結束的次日自動補)
    - cron: '10 9 * * *'   # UTC 09:10
    - cron: '10 13 * * *'  # UTC 13:10(台灣 21:10)
    - cron: '10 22 * * *'  # 台灣 06:10；美東夏令 18:10／冬令 17:10，快速更新
    - cron: '10 0 * * *'   # 台灣 08:10；美東夏令 20:10／冬令 19:10，補西岸晚場
  workflow_dispatch:        # 也可在 Actions 頁面手動觸發

permissions:
  contents: write

concurrency:
  group: nba-calib
  cancel-in-progress: ${{ github.event_name == 'push' || github.event.schedule == '10 22 * * *' || github.event.schedule == '10 0 * * *' }}

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 安裝 jsdom(雲端直接執行網頁本身的模型)
        run: npm install --no-save --no-package-lock --no-audit --no-fund jsdom@24 pdf-parse@1.1.1
      - name: 驗證勝分差核心
        run: |
          node scripts/test-margin-unit.cjs
          node scripts/test-quality-unit.cjs
          node scripts/test-injury-report-time.cjs
          node scripts/test-robust-unit.cjs
          node scripts/test-injury-identity.cjs
          node scripts/test-game-context.cjs
          node scripts/test-availability-unit.cjs
          node scripts/test-forecast-audit.cjs
      - name: 執行校準
        env:
          NBA_FAST_REFRESH: ${{ (github.event_name == 'push' || github.event.schedule == '10 22 * * *' || github.event.schedule == '10 0 * * *') && '1' || '0' }}
        run: node scripts/calib.js
      - name: 提交結果
        run: |
          git config user.name "calib-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A calib.json pdb.json margin-model.json quality-model.json robust-shadow.json availability-shadow.json forecast-audit.json seed
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m "每日自動校準 $(date -u +%F)"
          git pull --rebase origin main
          git push
